<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Network - Test Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Social Network Test Client</h1>

        <!-- Auth Section -->
        <div class="auth-section" id="authSection">
            <h2>🔐 Authentication</h2>
            
            <div class="tabs">
                <button class="tab active" onclick="switchAuthTab('register')">Register</button>
                <button class="tab" onclick="switchAuthTab('login')">Login</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="tab-content active">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="regUsername" placeholder="johndoe">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="regEmail" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="regPassword" placeholder="password123">
                </div>
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" id="regFirstName" placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" id="regLastName" placeholder="Doe">
                </div>
                <button onclick="register()">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="tab-content">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" placeholder="password123">
                </div>
                <button onclick="login()">Login</button>
            </div>

            <div id="authStatus"></div>
        </div>

        <!-- Main Section (hidden until logged in) -->
        <div class="main-section hidden" id="mainSection">
            <div class="user-info" id="userInfo"></div>
            <button onclick="logout()">Logout</button>
            <button onclick="getSession()">Get Session</button>

            <div class="tabs" style="margin-top: 20px;">
                <button class="tab active" onclick="switchMainTab('profile')">Profile</button>
                <button class="tab" onclick="switchMainTab('posts')">Posts</button>
                <button class="tab" onclick="switchMainTab('users')">Users</button>
                <button class="tab" onclick="switchMainTab('groups')">Groups</button>
            </div>

            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content active">
                <h2>👤 Profile Management</h2>
                <button onclick="getProfile()">Get My Profile</button>
                <button onclick="showUpdateProfile()">Update Profile</button>
                
                <div id="updateProfileForm" class="hidden" style="margin-top: 20px;">
                    <div class="form-group">
                        <label>Nickname:</label>
                        <input type="text" id="updateNickname" placeholder="Cool Nickname">
                    </div>
                    <div class="form-group">
                        <label>About Me:</label>
                        <textarea id="updateAboutMe" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Profile Visibility:</label>
                        <select id="updateIsPublic">
                            <option value="1">Public</option>
                            <option value="0">Private</option>
                        </select>
                    </div>
                    <button onclick="updateProfile()">Save Changes</button>
                    <button onclick="hideUpdateProfile()">Cancel</button>
                </div>

                <div class="response-box" id="profileResponse"></div>
            </div>

            <!-- Posts Tab -->
            <div id="postsTab" class="tab-content">
                <h2>📝 Posts & Feed</h2>
                <button onclick="showCreatePost()">Create Post</button>
                <button onclick="getFeed()">Get Feed</button>

                <div id="createPostForm" class="hidden" style="margin-top: 20px;">
                    <div class="form-group">
                        <label>Content:</label>
                        <textarea id="postContent" placeholder="What's on your mind?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Privacy Level:</label>
                        <select id="postPrivacy">
                            <option value="public">Public</option>
                            <option value="private">Private (followers only)</option>
                            <option value="almost_private">Almost Private (selected users)</option>
                        </select>
                    </div>
                    <button onclick="createPost()">Post</button>
                    <button onclick="hideCreatePost()">Cancel</button>
                </div>

                <div id="feedContainer"></div>
                <div class="response-box" id="postsResponse"></div>
            </div>

            <!-- Users Tab -->
            <div id="usersTab" class="tab-content">
                <h2>👥 Users & Social</h2>
                <div class="form-group">
                    <label>Search Users:</label>
                    <input type="text" id="searchQuery" placeholder="Search by name...">
                    <button onclick="searchUsers()" style="margin-top: 10px;">Search</button>
                </div>

                <button onclick="getFollowers()">My Followers</button>
                <button onclick="getFollowing()">My Following</button>

                <div id="usersContainer"></div>
                <div class="response-box" id="usersResponse"></div>
            </div>

            <!-- Groups Tab -->
            <div id="groupsTab" class="tab-content">
                <h2>👥 Groups</h2>
                
                <!-- Group Actions -->
                <div class="button-group">
                    <button onclick="showCreateGroup()">Create Group</button>
                    <button onclick="browseGroups()">Browse All Groups</button>
                    <button onclick="getMyGroups()">My Groups</button>
                </div>

                <!-- Create Group Form -->
                <div id="createGroupForm" class="hidden form-section">
                    <h3>Create New Group</h3>
                    <div class="form-group">
                        <label>Group Name:</label>
                        <input type="text" id="groupName" placeholder="My Awesome Group">
                    </div>
                    <div class="form-group">
                        <label>Description:</label>
                        <textarea id="groupDescription" placeholder="What's this group about?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image URL (optional):</label>
                        <input type="text" id="groupImageURL" placeholder="https://...">
                    </div>
                    <button onclick="createGroup()">Create</button>
                    <button onclick="hideCreateGroup()">Cancel</button>
                </div>

                <!-- Groups List Container -->
                <div id="groupsListContainer"></div>

                <!-- Group Detail View (hidden by default) -->
                <div id="groupDetailView" class="hidden">
                    <button onclick="hideGroupDetail()">← Back to Groups</button>
                    <div id="groupDetailContent"></div>
                    
                    <!-- Group Actions (for members) -->
                    <div id="groupMemberActions" class="hidden">
                        <h3>Group Actions</h3>
                        <button onclick="showInviteMember()">Invite Member</button>
                        <button onclick="showCreateEvent()">Create Event</button>
                        <button onclick="viewGroupMembers()">View Members</button>
                        <button onclick="viewGroupEvents()">View Events</button>
                    </div>

                    <!-- Creator-only Actions -->
                    <div id="groupCreatorActions" class="hidden">
                        <button onclick="viewPendingRequests()">View Join Requests</button>
                    </div>

                    <!-- Invite Member Form -->
                    <div id="inviteMemberForm" class="hidden form-section">
                        <h3>Invite Member</h3>
                        <div class="form-group">
                            <label>User ID:</label>
                            <input type="number" id="inviteUserId" placeholder="Enter user ID">
                        </div>
                        <button onclick="inviteMember()">Send Invite</button>
                        <button onclick="hideInviteMember()">Cancel</button>
                    </div>

                    <!-- Create Event Form -->
                    <div id="createEventForm" class="hidden form-section">
                        <h3>Create Event</h3>
                        <div class="form-group">
                            <label>Event Title:</label>
                            <input type="text" id="eventTitle" placeholder="Summer BBQ">
                        </div>
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea id="eventDescription" placeholder="Event details..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Event Date & Time:</label>
                            <input type="datetime-local" id="eventTime">
                        </div>
                        <button onclick="createGroupEvent()">Create Event</button>
                        <button onclick="hideCreateEvent()">Cancel</button>
                    </div>

                    <!-- Members List -->
                    <div id="groupMembersList" class="hidden">
                        <h3>Group Members</h3>
                        <div id="membersContainer"></div>
                    </div>

                    <!-- Events List -->
                    <div id="groupEventsList" class="hidden">
                        <h3>Group Events</h3>
                        <div id="eventsContainer"></div>
                    </div>

                    <!-- Pending Requests (Creator only) -->
                    <div id="pendingRequestsList" class="hidden">
                        <h3>Pending Join Requests</h3>
                        <div id="requestsContainer"></div>
                    </div>
                </div>

                <div class="response-box" id="groupsResponse"></div>
            </div>
        </div>

        <div id="globalStatus"></div>
    </div>

    <!-- Load JavaScript modules in order -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
